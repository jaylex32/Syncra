name: Build Syncra Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            ext: .exe
            icon: --icon="Syncra Icon.ico"
          - os: ubuntu-latest
            name: Linux
            ext: ""
            icon: ""
          - os: macos-latest
            name: macOS
            ext: ""
            icon: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine xvfb-run

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install python-tk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 plexapi requests spotipy fuzzywuzzy python-levenshtein pyotp deezer-python Pillow pyinstaller

    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m pyinstaller --onefile --windowed --name="Syncra-${{ matrix.name }}" --icon="Syncra Icon.ico" --hidden-import=pyotp --hidden-import=spotipy --hidden-import=deezer --hidden-import=fuzzywuzzy --hidden-import=plexapi --hidden-import=PyQt5.QtSvg main.py

    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        xvfb-run -a python -m pyinstaller --onefile --windowed --name="Syncra-${{ matrix.name }}" --hidden-import=pyotp --hidden-import=spotipy --hidden-import=deezer --hidden-import=fuzzywuzzy --hidden-import=plexapi --hidden-import=PyQt5.QtSvg main.py

    - name: Build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        python -m pyinstaller --onefile --windowed --name="Syncra-${{ matrix.name }}" --hidden-import=pyotp --hidden-import=spotipy --hidden-import=deezer --hidden-import=fuzzywuzzy --hidden-import=plexapi --hidden-import=PyQt5.QtSvg main.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Syncra-${{ matrix.name }}
        path: dist/Syncra-${{ matrix.name }}${{ matrix.ext }}

    - name: Create release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Syncra-${{ matrix.name }}${{ matrix.ext }}